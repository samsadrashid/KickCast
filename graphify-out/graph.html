});

  n.x = comCenters[n.community].x + (Math.random()-0.5)*80;
  n.y = comCenters[n.community].y + (Math.random()-0.5)*80;
});

// SVG groups
const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
const filter = document.createElementNS('http://www.w3.org/2000/svg','filter');
filter.setAttribute('id','glow');
const fegb = document.createElementNS('http://www.w3.org/2000/svg','feGaussianBlur');
fegb.setAttribute('stdDeviation','3'); fegb.setAttribute('result','blur');
const femerge = document.createElementNS('http://www.w3.org/2000/svg','feMerge');
['blur','SourceGraphic'].forEach(v => {
  const n = document.createElementNS('http://www.w3.org/2000/svg','feMergeNode');
  n.setAttribute('in', v); femerge.appendChild(n);
});
filter.appendChild(fegb); filter.appendChild(femerge); defs.appendChild(filter);
svg.appendChild(defs);

const gLinks = document.createElementNS('http://www.w3.org/2000/svg','g');
const gNodes = document.createElementNS('http://www.w3.org/2000/svg','g');
svg.appendChild(gLinks); svg.appendChild(gNodes);

// Draw edges
const lineEls = links.map(l => {
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('stroke', l.confidence==='EXTRACTED' ? '#3A4F6E' : '#2a3d55');
  line.setAttribute('stroke-width', l.confidence==='EXTRACTED' ? '1.5' : '0.8');
  line.setAttribute('stroke-dasharray', l.confidence==='INFERRED' ? '4,3' : 'none');
  line.setAttribute('opacity', '0.6');
  gLinks.appendChild(line);
  return {el: line, link: l};
});

// Draw nodes
const nodeEls = {};
nodes.forEach(n => {
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.style.cursor = 'pointer';
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('r', n.size);
  circle.setAttribute('fill', n.color);
  circle.setAttribute('stroke', '#0A1931');
  circle.setAttribute('stroke-width', '1.5');
  const text = document.createElementNS('http://www.w3.org/2000/svg','text');
  text.setAttribute('text-anchor','middle');
  text.setAttribute('dominant-baseline','hanging');
  text.setAttribute('y', n.size+3);
  text.setAttribute('font-size','9');
  text.setAttribute('fill','#8A9BB5');
  text.setAttribute('pointer-events','none');
  const shortLabel = n.label.length > 14 ? n.label.slice(0,12)+'…' : n.label;
  text.textContent = shortLabel;
  g.appendChild(circle); g.appendChild(text);

  // Hover
  const tooltip = document.getElementById('tooltip');
  g.addEventListener('mouseenter', (e) => {
    circle.setAttribute('filter','url(#glow)');
    circle.setAttribute('stroke', n.color);
    circle.setAttribute('stroke-width','2.5');
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<strong>${n.label}</strong><br><span style="color:#8A9BB5">${n.community_label}</span><br><span style="color:#8A9BB5">degree ${n.degree} · ${n.source_file}</span>`;
  });
  g.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.clientX+12)+'px';
    tooltip.style.top = (e.clientY-8)+'px';
  });
  g.addEventListener('mouseleave', () => {
    circle.removeAttribute('filter');
    circle.setAttribute('stroke','#0A1931');
    circle.setAttribute('stroke-width','1.5');
    tooltip.style.display='none';
  });
  g.addEventListener('click', () => {
    const connLinks = links.filter(l => l.source===n.id||l.target===n.id);
    const sb = document.getElementById('sidebar');
    const sc = document.getElementById('sidebar-content');
    sc.innerHTML = `
      <div class="node-title" style="color:${n.color}">${n.label}</div>
      <div class="meta">Community: ${n.community_label}</div>
      <div class="meta">File: ${n.source_file}${n.source_location ? ':'+n.source_location : ''}</div>
      <div class="meta">Type: ${n.file_type} · Degree: ${n.degree}</div>
      <div class="edges-list"><strong style="font-size:11px;color:#B4FF02;text-transform:uppercase;letter-spacing:1px">Connections</strong>
      ${connLinks.map(l => {
        const other = l.source===n.id ? l.target : l.source;
        const otherNode = nodeMap[other];
        const dir = l.source===n.id ? '→' : '←';
        return `<div class="edge-item">${dir} <span>${otherNode?.label||other}</span> <em style="color:#3A4F6E">${l.relation}</em></div>`;
      }).join('')}
      </div>`;
    sb.classList.add('open');
  });

  gNodes.appendChild(g);
  nodeEls[n.id] = {g, circle, x: n.x, y: n.y, node: n};
});

// Force sim
function simulate() {
  const REPULSE = 800, ATTRACT = 0.03, DAMPING = 0.85, CLUSTER = 0.015;
  for (let i=0; i<nodes.length; i++) {
    const a = nodes[i];
    // Repulsion
    for (let j=i+1; j<nodes.length; j++) {
      const b = nodes[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const dist = Math.sqrt(dx*dx+dy*dy)||1;
      const force = REPULSE/(dist*dist);
      const fx = dx/dist*force, fy = dy/dist*force;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
    // Cluster gravity
    const cc = comCenters[a.community];
    a.vx += (cc.x - a.x) * CLUSTER;
    a.vy += (cc.y - a.y) * CLUSTER;
  }
  // Link attraction
  links.forEach(l => {
    const a = nodeMap[l.source], b = nodeMap[l.target];
    if (!a||!b) return;
    const dx = b.x-a.x, dy = b.y-a.y;
    a.vx += dx*ATTRACT; a.vy += dy*ATTRACT;
    b.vx -= dx*ATTRACT; b.vy -= dy*ATTRACT;
  });
  // Integrate
  nodes.forEach(n => {
    n.vx *= DAMPING; n.vy *= DAMPING;
    n.x = Math.max(30, Math.min(W-30, n.x+n.vx));
    n.y = Math.max(30, Math.min(H-30, n.y+n.vy));
    const el = nodeEls[n.id];
    if (el) { el.x = n.x; el.y = n.y; }
  });
  // Update DOM
  lineEls.forEach(({el, link}) => {
    const a = nodeMap[link.source], b = nodeMap[link.target];
    if (a&&b) { el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y); }
  });
  Object.values(nodeEls).forEach(({g,node}) => {
    g.setAttribute('transform', `translate(${node.x},${node.y})`);
  });
}

let frame = 0;
function loop() {
  if (frame < 300) { simulate(); frame++; }
  requestAnimationFrame(loop);
}
// Also allow drag
let dragging = null;
svg.addEventListener('mousedown', e => {
  const target = e.target.closest('g');
  if (target) { const nid = Object.keys(nodeEls).find(k => nodeEls[k].g === target); if (nid) dragging = nid; }
});
svg.addEventListener('mousemove', e => {
  if (dragging) {
    const n = nodeMap[dragging];
    if (n) { n.x = e.clientX; n.y = e.clientY; n.vx=0; n.vy=0; }
  }
});
svg.addEventListener('mouseup', () => dragging = null);

loop();
</script>
</body></html>
